name: FieldSat

on:
  pull_request:
    paths: ["fieldsat/**", ".github/workflows/fieldsat.yml"]
  push:
    branches: [main]
    paths: ["fieldsat/**", ".github/workflows/fieldsat.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: fieldsat

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uvx ruff check src tests
      - run: uv run pytest
