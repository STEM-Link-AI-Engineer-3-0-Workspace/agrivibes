name: Frontend

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uvx ruff check .
      - run: uv run pytest
